# Nenhum segredo fica neste arquivo: tudo vem de variáveis de ambiente
# ou do arquivo .env na raiz do projeto (veja .env.example).
# Variáveis sensíveis não têm valor padrão: se faltarem, a API não sobe
# e o erro mostra o nome da variável.

spring.application.name=beaconsync

spring.config.import=optional:file:.env[.properties]

# --- Banco Oracle ---
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=BS_FLYWAY_HISTORY
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

beaconsync.jwt.secret=${JWT_SECRET}
beaconsync.jwt.expiracao-segundos=${JWT_EXPIRACAO_SEGUNDOS:7200}
beaconsync.jwt.issuer=beaconsync-api

# --- Usuários de teste (criados na subida, se ainda não existirem) ---
beaconsync.seed.enabled=${SEED_ENABLED:true}
beaconsync.seed.senha=${SEED_PASSWORD:}

# --- CORS (app Mobile rodando no navegador / Expo web) ---
beaconsync.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- Servidor ---
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never

# --- Actuator ---
management.endpoints.web.exposure.include=health

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method