# Nenhum segredo fica neste arquivo: tudo vem de variáveis de ambiente
# ou do arquivo .env na raiz do projeto (veja .env.example).
# Variáveis sensíveis não têm valor padrão: se faltarem, a API não sobe
# e o erro mostra o nome da variável.

spring.application.name=beaconsync

# Lê o .env da raiz como properties (KEY=VALUE). Opcional: no Docker
# as variáveis chegam pelo env_file do compose.
spring.config.import=optional:file:.env[.properties]

# --- Banco Oracle ---
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA ---
spring.jpa.open-in-view=false
# O Flyway é o dono do schema; o Hibernate não cria nem altera tabelas
spring.jpa.hibernate.ddl-auto=none

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Tabela de controle com prefixo próprio: no Oracle da FIAP o schema
# é compartilhado com outros projetos do mesmo RM
spring.flyway.table=BS_FLYWAY_HISTORY
# Permite migrar um schema que já tem tabelas de outros projetos.
# baseline-version 0 garante que a V1 ainda seja executada.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Segurança (JWT) ---
# Segredo HS256 com pelo menos 32 caracteres: só existe no .env
beaconsync.jwt.secret=${JWT_SECRET}
beaconsync.jwt.expiracao-segundos=${JWT_EXPIRACAO_SEGUNDOS:7200}
beaconsync.jwt.issuer=${JWT_ISSUER:beaconsync-api}

# Sessão de renovação (refresh token): prazo absoluto desde o login
beaconsync.jwt.refresh-expiracao-segundos=${JWT_REFRESH_EXPIRACAO_SEGUNDOS:604800}

# --- Usuários de teste (criados na subida, se ainda não existirem) ---
beaconsync.seed.enabled=${SEED_ENABLED:true}
beaconsync.seed.senha=${SEED_PASSWORD:}

# --- CORS (app Mobile rodando no navegador / Expo web) ---
beaconsync.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- Dados de demonstração (pessoas em 3 distritos da Lapa para o mapa) ---
beaconsync.seed.demo=${SEED_DEMO:true}

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Mensagem que falha no consumidor não volta para a fila: vai para a DLQ
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Mapa: faixas de cor por quantidade de pessoas ainda sem segurança ---
beaconsync.mapa.faixa-amarelo=1
beaconsync.mapa.faixa-laranja=10
beaconsync.mapa.faixa-vermelho=30

# --- Prioridade sugerida da fila (pesos somam 100) ---
beaconsync.prioridade.peso-gravidade=40
beaconsync.prioridade.peso-tempo=30
beaconsync.prioridade.peso-cor=30
beaconsync.prioridade.minutos-tempo-maximo=120

# --- IA (Spring AI + OpenAI) ---
# AI_PROVIDER=openai liga a IA; none usa só a regra base (não precisa de chave).
# Sem chave, o valor "sem-chave" deixa o Spring AI subir; a API não chama o LLM.
beaconsync.ia.provedor=${AI_PROVIDER:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:sem-chave}

# --- Análise de distrito pela API Python (IoT), independente do Spring AI ---
# Sem IA_SERVICE_API_KEY a API sobe normalmente; só a análise responde 503.
beaconsync.ia.distrito.base-url=${IA_BASE_URL:https://beaconsync-ia.onrender.com}
beaconsync.ia.distrito.api-key=${IA_SERVICE_API_KEY:}
beaconsync.ia.distrito.connect-timeout=${IA_CONNECT_TIMEOUT:10s}
beaconsync.ia.distrito.read-timeout=${IA_READ_TIMEOUT:90s}

# --- Servidor ---
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never

# --- Actuator ---
management.endpoints.web.exposure.include=health

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method